# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: burnout-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_2
        sync: false
      - key: GOOGLE_API_KEY_3
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: burnout-ai-platform
      - key: R2_PUBLIC_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
