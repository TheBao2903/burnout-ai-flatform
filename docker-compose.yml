# ===============================================================
# Burnout AI Platform - Docker Compose (dev stack)
# Services:
#   - qdrant:  Vector DB (local, persistent volume)
#   - server: FastAPI backend (Docker image)
#
# Usage:
#   docker compose up -d              # start all (Qdrant + Server)
#   docker compose logs -f server     # tail server logs
#   docker compose logs -f qdrant     # tail Qdrant logs
#   docker compose down               # stop + remove containers
#   docker compose down -v            # stop + remove containers + volumes (WIPE QDRANT data)
# ===============================================================

services:
  # -----------------------------------------------------------
  # Qdrant vector database (RAG memory + knowledge base)
  # -----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: burnout_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -----------------------------------------------------------
  # Burnout AI Server (FastAPI - Docker image)
  # Models downloaded on first startup (~1-3 minutes)
  # -----------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burnout_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      # Qdrant (trong docker network -> host = service name)
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: burnout_case_memory

      # Firebase
      GOOGLE_APPLICATION_CREDENTIALS: /app/config/serviceAccountKey.json

      # Google AI (Gemini)
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      GEMINI_EMBED_MODEL: "${GEMINI_EMBED_MODEL:-embedding-001}"
      TF_ENABLE_ONEDNN_OPTS: "0"  # Disable oneDNN warnings

      # Cloudflare R2
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"

      # Auth
      JWT_SECRET: "${JWT_SECRET:-change-me-please-32-chars-minimum}"

      # Server
      ENVIRONMENT: docker
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # TensorFlow + DeepFace initialization

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  qdrant_storage:
    name: burnout_qdrant_storage

# -----------------------------------------------------------
# Default network (cho phép server <-> qdrant resolve theo service name)
# -----------------------------------------------------------
networks:
  default:
    name: burnout_net
